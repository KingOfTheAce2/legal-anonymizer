name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.10", "3.11", "3.12"]

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Cache pip packages
      uses: actions/cache@v4
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('**/pyproject.toml') }}
        restore-keys: |
          ${{ runner.os }}-pip-

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        cd engine/python
        pip install -e ".[layer1,dev]"

    - name: Download spaCy models
      run: |
        python -m spacy download en_core_web_sm

    - name: Lint with ruff
      run: |
        cd engine/python
        ruff check .

    - name: Type check with mypy
      run: |
        cd engine/python
        mypy anonymizer_engine --ignore-missing-imports

    - name: Security check with bandit
      run: |
        cd engine/python
        bandit -r anonymizer_engine -c pyproject.toml

    - name: Run tests with pytest
      run: |
        cd engine/python
        pytest --cov=anonymizer_engine --cov-report=xml --cov-report=term

    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v4
      with:
        file: ./engine/python/coverage.xml
        flags: unittests
        name: codecov-umbrella

  benchmarks:
    runs-on: ubuntu-latest
    continue-on-error: true   # benchmark failures don't block CI
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        cd engine/python
        pip install -e ".[layer1,dev]"
        python -m spacy download en_core_web_sm

    - name: Run performance benchmarks
      run: |
        cd engine/python
        pytest tests/benchmarks/ --benchmark-only --benchmark-json=benchmark.json

    - name: Store benchmark results
      uses: benchmark-action/github-action-benchmark@v1
      with:
        tool: 'pytest'
        output-file-path: engine/python/benchmark.json
        github-token: ${{ secrets.GITHUB_TOKEN }}
        auto-push: false
        comment-on-alert: false
