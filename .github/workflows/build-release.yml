name: Build Release

# Triggered by a version tag (e.g. git tag v1.0.0 && git push --tags)
# or manually via the GitHub Actions UI.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      layer:
        description: 'Detection layers to bundle'
        required: true
        default: 'layer1'
        type: choice
        options:
          - layer1
          - layer1-layer3
          - all

# ─────────────────────────────────────────────────────────────────
# JOB 1 — Build the Python sidecar with PyInstaller on each platform
# ─────────────────────────────────────────────────────────────────
jobs:
  build-sidecar:
    name: Python sidecar (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    continue-on-error: true   # one flaky runner won't cancel other platforms
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            triple: x86_64-pc-windows-msvc
            artifact_src: anonymizer_engine.exe
            artifact_dst: anonymizer_engine-x86_64-pc-windows-msvc.exe

          - os: macos-latest      # ARM runner — sidecar also used for Universal DMG
            triple: aarch64-apple-darwin
            artifact_src: anonymizer_engine
            artifact_dst: anonymizer_engine-aarch64-apple-darwin

          - os: ubuntu-latest
            triple: x86_64-unknown-linux-gnu
            artifact_src: anonymizer_engine
            artifact_dst: anonymizer_engine-x86_64-unknown-linux-gnu

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install engine + PyInstaller
        run: |
          cd engine/python
          # Install CPU-only torch first to avoid bundling CUDA libraries (saves ~1.5GB on Linux)
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -e ".[layer1,layer2,layer3,pdf,docx,pptx]"
          pip install pyinstaller

      - name: Download spaCy models
        run: |
          python -m spacy download en_core_web_sm
          python -m spacy download en_core_web_lg

      - name: Build standalone sidecar executable
        run: |
          cd engine/python
          python -m PyInstaller anonymizer_engine.spec --noconfirm

      - name: Rename to Tauri triple format
        shell: bash
        run: |
          src="engine/python/dist/${{ matrix.artifact_src }}"
          dst="engine/python/dist/${{ matrix.artifact_dst }}"
          mv "$src" "$dst"
          echo "Sidecar: $dst ($(du -sh "$dst" | cut -f1))"

      - name: Upload sidecar artifact
        uses: actions/upload-artifact@v4
        with:
          name: sidecar-${{ matrix.triple }}
          path: engine/python/dist/${{ matrix.artifact_dst }}
          if-no-files-found: error
          retention-days: 1

# ─────────────────────────────────────────────────────────────────
# JOB 2 — Bundle sidecar into Tauri installer on each platform
# ─────────────────────────────────────────────────────────────────
  build-installer:
    name: Installer (${{ matrix.os }})
    needs: build-sidecar
    if: always()   # run even if some sidecars were cancelled
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            triple: x86_64-pc-windows-msvc
            rust_target: x86_64-pc-windows-msvc
            label: windows
            bundles: nsis

          - os: macos-latest
            triple: aarch64-apple-darwin
            rust_target: universal-apple-darwin
            label: macos-universal
            bundles: dmg

          - os: ubuntu-latest
            triple: x86_64-unknown-linux-gnu
            rust_target: x86_64-unknown-linux-gnu
            label: linux
            bundles: deb,appimage

    steps:
      - uses: actions/checkout@v4

      # ── Drop the pre-built sidecar into the Tauri binaries folder ──
      - name: Download sidecar
        id: download_sidecar
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: sidecar-${{ matrix.triple }}
          path: apps/desktop/src-tauri/binaries/

      - name: Abort if sidecar unavailable
        if: steps.download_sidecar.outcome != 'success'
        run: |
          echo "::warning::Sidecar artifact for ${{ matrix.triple }} not available (sidecar build was skipped or cancelled). Skipping installer."
          exit 1

      - name: Make sidecar executable (macOS / Linux)
        if: runner.os != 'Windows'
        run: chmod +x apps/desktop/src-tauri/binaries/anonymizer_engine-${{ matrix.triple }}

      - name: Add Intel sidecar alias for Universal build (runs via Rosetta 2)
        if: matrix.rust_target == 'universal-apple-darwin'
        run: |
          cp apps/desktop/src-tauri/binaries/anonymizer_engine-aarch64-apple-darwin \
             apps/desktop/src-tauri/binaries/anonymizer_engine-x86_64-apple-darwin

      # ── Node / npm ──
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: apps/desktop/package-lock.json

      # ── Rust ──
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target == 'universal-apple-darwin' && 'aarch64-apple-darwin,x86_64-apple-darwin' || matrix.rust_target }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri

      # ── Linux system deps ──
      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf

      # ── Build ──
      - name: Install npm dependencies
        run: |
          cd apps/desktop
          npm ci

      - name: Build Tauri app
        run: |
          cd apps/desktop
          npm run tauri build -- --target ${{ matrix.rust_target }} --bundles ${{ matrix.bundles }}

      # ── Collect installer files ──
      - name: Collect installer artifacts
        shell: bash
        run: |
          mkdir -p dist-release
          BUNDLE="apps/desktop/src-tauri/target/${{ matrix.rust_target }}/release/bundle"
          # Windows
          find "$BUNDLE/msi"   -name "*.msi"      -exec cp {} dist-release/ \; 2>/dev/null || true
          find "$BUNDLE/nsis"  -name "*.exe"      -exec cp {} dist-release/ \; 2>/dev/null || true
          # macOS
          find "$BUNDLE/dmg"   -name "*.dmg"      -exec cp {} dist-release/ \; 2>/dev/null || true
          # Linux
          find "$BUNDLE/deb"   -name "*.deb"      -exec cp {} dist-release/ \; 2>/dev/null || true
          find "$BUNDLE/appimage" -name "*.AppImage" -exec cp {} dist-release/ \; 2>/dev/null || true
          find "$BUNDLE/rpm"   -name "*.rpm"      -exec cp {} dist-release/ \; 2>/dev/null || true
          echo "Collected:" && ls -lh dist-release/

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: installer-${{ matrix.label }}
          path: dist-release/*
          if-no-files-found: warn

# ─────────────────────────────────────────────────────────────────
# JOB 3 — Publish GitHub Release (only when triggered by a tag)
# ─────────────────────────────────────────────────────────────────
  publish-release:
    name: Publish GitHub Release
    needs: build-installer
    runs-on: ubuntu-latest
    if: always() && startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write

    steps:
      - name: Download all installer artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: installer-*
          path: artifacts/
          merge-multiple: true

      - name: List release files
        run: ls -lh artifacts/

      - name: Remove assets exceeding GitHub 2GB limit
        run: |
          for f in artifacts/*; do
            size=$(stat -c%s "$f" 2>/dev/null || stat -f%z "$f" 2>/dev/null || echo 0)
            if [ "$size" -gt 1900000000 ]; then
              echo "Skipping $(basename $f) ($(du -sh $f | cut -f1)) — exceeds GitHub 2GB release asset limit"
              rm "$f"
            fi
          done
          echo "Assets to release:" && ls -lh artifacts/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          draft: false
          prerelease: false
          generate_release_notes: true
          body: |
            ## Redactly Legal ${{ github.ref_name }}

            **One-click install — no Python, no dependencies.**

            | Platform | File | Notes |
            |----------|------|-------|
            | Windows  | `.msi` installer | Recommended |
            | Windows  | `-setup.exe` | Alternative NSIS installer |
            | macOS Intel | `.dmg` | For Intel Macs |
            | macOS Apple Silicon | `.dmg` | For M1/M2/M3 Macs |
            | Linux (Debian/Ubuntu) | `.deb` | |
            | Linux (any) | `.AppImage` | Portable, no install needed |

            ### Installation

            **Windows:** Download the `.msi`, double-click, follow the 3-step wizard.
            Launch from the Start Menu. No internet connection required after install.

            **macOS:** Download the `.dmg`, open it, drag the app to Applications.
            You may need to right-click → Open the first time (Gatekeeper warning).

            **Linux:** `.deb` → `sudo dpkg -i redactly-legal*.deb`
            `.AppImage` → `chmod +x *.AppImage && ./Redactly*.AppImage`

            ### System Requirements
            - Windows 10 / 11 (64-bit)
            - macOS 11 Big Sur or later
            - Ubuntu 20.04 / Debian 11 or equivalent
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
