[project]
name = "anonymizer-engine"
version = "0.1.0"
description = "Offline-first legal anonymization engine for GDPR-compliant text and document scrubbing"
requires-python = ">=3.10"
license = {text = "Elastic-2.0"}
authors = [
    {name = "Legal Anonymizer Team"}
]
keywords = ["anonymization", "gdpr", "privacy", "legal", "nlp", "ner"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Legal Industry",
    "License :: Other/Proprietary License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Text Processing",
    "Topic :: Security",
]

dependencies = [
    "python-dateutil>=2.9.0",
    "langdetect>=1.0.9",
]

[project.optional-dependencies]
# Layer 1: Fast Legal Scrub (spaCy-based)
layer1 = [
    "spacy>=3.7.0",
]

# Layer 2: Accurate Legal Review (transformer-based)
layer2 = [
    "spacy>=3.7.0",
    "transformers>=4.36.0",
    "torch>=2.0.0",
]

# Layer 3: Regulatory Standard (Presidio-based)
layer3 = [
    "spacy>=3.7.0",
    "presidio-analyzer>=2.2.0",
    "presidio-anonymizer>=2.2.0",
]

# PDF support
pdf = [
    "PyMuPDF>=1.23.0",
]

# DOCX support
docx = [
    "python-docx>=1.1.0",
]

# PPTX support
pptx = [
    "python-pptx>=0.6.23",
]

# All features
all = [
    "spacy>=3.7.0",
    "transformers>=4.36.0",
    "torch>=2.0.0",
    "presidio-analyzer>=2.2.0",
    "presidio-anonymizer>=2.2.0",
    "PyMuPDF>=1.23.0",
    "python-docx>=1.1.0",
    "python-pptx>=0.6.23",
]

# Development dependencies
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "pytest-benchmark>=4.0.0",
    "ruff>=0.4.0",
    "mypy>=1.7.0",
    "bandit[toml]>=1.7.5",
    "pre-commit>=3.5.0",
]

[project.scripts]
anonymizer-sidecar = "scripts.sidecar_entrypoint:main"
anonymizer-batch = "scripts.batch_entrypoint:main"

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
# Start with stable core rules only; UP/N/B/C4/I can be re-added incrementally
select = ["E", "F", "W"]
ignore = ["E501"]  # Line length handled by formatter

[tool.ruff.lint.per-file-ignores]
# __init__.py files intentionally re-export symbols; F401 fires on those
"**/__init__.py" = ["F401"]
# Test files may import symbols used only indirectly via fixtures;
# benchmark tests intentionally assign results to variables for timing (F841)
"tests/**/*.py" = ["F401", "F841"]
# Scripts have intentional import-after-code patterns (frozen binary path setup)
# and may have indirect imports; suppress F401 and E402 for them
"scripts/*.py" = ["F401", "E402"]
"scripts/sidecar_entrypoint.py" = ["F401", "E402"]
# performance_example.py is a demo/utility; suppress F841 for timing assignments
"anonymizer_engine/performance_example.py" = ["F841", "E722"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
no_implicit_optional = false
warn_return_any = false
warn_unused_configs = true
check_untyped_defs = false
disable_error_code = [
    "misc",
    "assignment",
    "operator",
    "attr-defined",
    "index",
    "call-overload",
    "valid-type",
    "no-redef",
]

[tool.bandit]
exclude_dirs = ["tests", "venv", ".venv"]
skips = [
    "B101",   # Allow assert statements in tests
    "B110",   # try/except/pass is intentional for optional features (headers, metadata)
    "B310",   # urllib.request.urlopen is used for model downloads (controlled URLs)
    "B615",   # HuggingFace from_pretrained with local_files_only=True is safe
]
